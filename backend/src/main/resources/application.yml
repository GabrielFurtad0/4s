server:
  port: ${PORT:8085}

spring:
  application:
    name: totaltrigo-erp-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/totaltrigo_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

totaltrigo:
  cors:
    allowed-origins: ${TOTALTRIGO_CORS_ALLOWED_ORIGINS:*}
  company:
    corporate-name: "TOTAL TRIGO COMERCIO DE ALIMENTOS LTDA"
    cnpj: "09265201000195"
    state-registration: "149932895118"
    ibge-city-code: "3550308"
    state: "SP"
  fiscal:
    provider: "FOCUS_NFE_SIMULATOR" # Opções: FOCUS_NFE_SIMULATOR, NUVEM_FISCAL
    default-shipping-estimate: 4.00
    shipping-per-sack: 4.00

