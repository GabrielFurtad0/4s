server:
  port: ${PORT:8085}

spring:
  application:
    name: totaltrigo-erp-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/totaltrigo}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TotalTrigoHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      leak-detection-threshold: 30000

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

totaltrigo:
  company:
    corporate-name: ${TOTALTRIGO_COMPANY_NAME:"TOTAL TRIGO COMERCIO DE ALIMENTOS LTDA"}
    cnpj: ${TOTALTRIGO_COMPANY_CNPJ:"09265201000195"}
    state-registration: ${TOTALTRIGO_COMPANY_IE:"149932895118"}
    ibge-city-code: ${TOTALTRIGO_COMPANY_IBGE:"3550308"}
    state: ${TOTALTRIGO_COMPANY_STATE:"SP"}
  fiscal:
    provider: ${TOTALTRIGO_FISCAL_PROVIDER:FOCUS_NFE_SIMULATOR}
    default-shipping-estimate: ${TOTALTRIGO_SHIPPING_ESTIMATE:45.00}
