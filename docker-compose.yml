services:
  postgres:
    image: postgres:16-alpine
    container_name: totaltrigo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: totaltrigo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d totaltrigo"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - totaltrigo-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: totaltrigo-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/totaltrigo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PORT: 8085
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - totaltrigo-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: totaltrigo-frontend
    restart: unless-stopped
    environment:
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - totaltrigo-net

volumes:
  postgres_data:
    driver: local

networks:
  totaltrigo-net:
    driver: bridge
